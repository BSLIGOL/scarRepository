spring:
  application:
    name: SCar

  datasource:
    url: jdbc:mysql://localhost:3306/scar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api          # API 경로 프리픽스 설정 (CloudFront 라우팅용)

jwt:
  secret: ${JWT_SECRET_DEV}
  token-validity-in-seconds: 3600
  cookie-secure: false # 로컬 개발 환경은 HTTPS가 아닐 수 있으므로 false
